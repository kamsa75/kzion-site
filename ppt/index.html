<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>주일예배 준비실</title>
<link rel="icon" href="../images/cropped-favicon-270x270.png">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/ppt.css?v=1">
</head>
<body>

<div id="app">

  <!-- PIN 입장 화면 -->
  <section id="screen-pin" class="screen screen-pin">
    <div class="pin-box">
      <p class="pin-church">시애틀 시온장로교회</p>
      <h1 class="pin-title">주일예배 준비실</h1>
      <p class="pin-desc">담당자용 페이지입니다. 전달받은 PIN을 입력하세요.</p>
      <form id="pin-form" autocomplete="off">
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
               maxlength="8" placeholder="PIN 입력" aria-label="PIN 입력">
        <p id="pin-error" class="pin-error" hidden>PIN이 올바르지 않습니다. 다시 확인해 주세요.</p>
        <button type="submit" class="btn btn-primary btn-wide">입장</button>
      </form>
      <p class="pin-foot">PIN을 모르시면 관리자에게 문의하세요.</p>
    </div>
  </section>

  <!-- 역할별 홈 -->
  <section id="screen-home" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">주일예배 준비실</span>
        <span id="home-role" class="role-chip"></span>
      </div>
      <button id="btn-logout" class="btn btn-ghost">로그아웃</button>
    </header>
    <main class="main">
      <div id="home-week" class="week-head"></div>
      <div id="home-sections" class="section-list"></div>
      <div id="home-admin-extra"></div>
      <p class="dev-note">개발 미리보기 단계 — 화면의 데이터는 예시(목 데이터)입니다. 저장되지 않습니다.</p>
    </main>
  </section>

  <!-- 슬라이드 디자인 미리보기 (개발 확인용 데모) -->
  <section id="screen-preview" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-preview-back" class="btn btn-ghost">← 돌아가기</button>
        <span class="topbar-title">슬라이드 디자인 미리보기</span>
      </div>
    </header>
    <main class="main">
      <p class="preview-guide">레이아웃 5종을 실제 비율(16:9)로 렌더링한 데모입니다. 방송 화면에서 초록 부분은 영상으로 대체(크로마키)됩니다.</p>
      <div id="preview-list" class="preview-list"></div>
    </main>
  </section>

</div>

<script src="js/mock.js?v=1"></script>
<script src="js/preview.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
